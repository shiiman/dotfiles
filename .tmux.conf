###########################################################
# 表示の設定                                                #
###########################################################
# 256色表示
set -g default-terminal "tmux-256color"

# True Color対応
set -ga terminal-overrides ",*256col*:Tc"

# バックスクロール行数を増やす
set -g history-limit 10000

# client側の環境変数をtmuxサーバに引き継ぐ
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY"


###########################################################
# キーバインドの設定                                          #
###########################################################
# キーバインド(あとで変更)
unbind-key C-b
set -g prefix C-t
bind-key C-t send-prefix

# コピーモードのキーマップをviに変更. 標準はemacs
setw -g mode-keys vi

# マウスドラッグで選択したら自動でコピー（選択状態を保持）
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
# シングルクリックで選択解除（通常のターミナルと同じ挙動）
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel

# reload config
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf is reloaded!"

# | でペインを縦に分割する（現在のディレクトリを維持）
bind | split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する（現在のディレクトリを維持）
bind - split-window -v -c "#{pane_current_path}"

# ペインの移動設定
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ペインのリサイズ設定
bind -r C-h resize-pane -L 10
bind -r C-l resize-pane -R 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10

# 複数のパネルに同入力のon/off
bind e setw synchronize-panes on
bind E setw synchronize-panes off


###########################################################
# プレフィックスなしのキーバインドの設定                      #
###########################################################
# Alt + d で縦分割、Alt + Shift + d で横分割（現在のディレクトリを維持）
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"

# Alt + 矢印でペイン移動
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Alt + n で新しいウィンドウ
bind -n M-n new-window

# Alt + r で次のウィンドウ、Alt + e で前のウィンドウに移動
bind -n M-r next-window
bind -n M-e previous-window

# Alt + 1〜9 でウィンドウ番号で移動
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt + z でペインの最大化/復元
bind -n M-z resize-pane -Z

# Alt + w でペイン閉じる（最後のペインならウィンドウも閉じる）
bind -n M-w kill-pane

# Alt + s でセッション一覧を表示して切り替え
bind -n M-s choose-session

# Alt + q でデタッチ
bind -n M-q detach-client


###########################################################
# ステータスラインの設定                                       #
###########################################################

# ステータスバーの色を設定する
set -g status-style "fg=black,bg=green"

# 左側のステータスライン設定（ズーム時は [Z] を表示）
set -g status-left ' [#S]#{?window_zoomed_flag, [Z],} '
set -g status-left-length 30

# ウィンドウリストの色を設定する
setw -g window-status-style "fg=black,bg=default,dim"

# アクティブなウィンドウを目立たせる
setw -g window-status-current-style "fg=white,bg=red,bright"

# ウィンドウのステータスラインのフォーマットを指定する。
setw -g window-status-format " #I: #W "
# カレントウィンドウのステータスラインのフォーマットを指定する
setw -g window-status-current-format " #I: #W * "
# ウィンドウ間に表示する文字
setw -g window-status-separator " | "

# 右側のステータスライン設定
set -g status-right '#(tmux show-options -g prefix) | #h | %m/%d %H:%M#[default] | '

# ペインの境界線
set -g pane-border-style "fg=colour22"
set -g pane-active-border-style "fg=green,bold"

# ペインの上部にパスを表示（アクティブペインは目立つように）
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=green#,bold] ▶ #[fg=white],  }#{pane_index}: #{s|^/Users/#{user}|~|:#{pane_current_path}} '


###########################################################
# その他の設定                                               #
###########################################################
# defaultではescキーの押下にディレイがあるので短くしておく
set -sg escape-time 0

# マウス操作 on
set -g mouse on

# スクロール速度の調整（1回のホイールで移動する行数: デフォルト5 → 2）
bind -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# ウィンドウを閉じたときに番号を詰める
set -g renumber-windows on

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1
