# mise グローバル設定
# https://mise.jdx.dev/configuration.html

[tools]
go = "1.26.11"
node = "26.13.0"
pnpm = "10.34.9"
python = "3.14.10"
terraform = "1.14.9"
terragrunt = "0.99.5"
uv = "0.13.7"

[settings]
# 実験的機能を無効化
experimental = false
# ツールがない場合に自動インストール
auto_install = true
# プロジェクト固定の未インストール版は自動で入れない(eMudhra ルートを含む古い Node.js を防ぐ)
not_found_auto_install = false
go_set_goroot = false
